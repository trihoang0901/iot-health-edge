[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-health-edge"
version = "0.1.0"
description = "Local non-clinical IoT health monitoring edge prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "paho-mqtt==2.1.0",
]

[project.scripts]
iot-health-edge = "edge.__main__:main"
iot-health-experiment = "simulator.experiment:main"

[project.optional-dependencies]
test = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
artifact = [
  "Pillow==12.3.0",
  "pypdfium2==5.12.1",
  "python-docx==1.2.0",
]

[tool.setuptools.packages.find]
include = ["edge*", "simulator*"]

[tool.setuptools.package-data]
edge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
