listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/generated/passwords
acl_file /mosquitto/config/generated/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

max_queued_messages 1000
# Allows the 4096-byte application payload cap plus MQTT topic/header overhead.
max_packet_size 5120
